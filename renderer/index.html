<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Younesh</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-top drag">
      <span class="brand">Younesh</span>
    </div>
    <div class="sidebar-actions">
      <button id="btn-new" class="primary" title="Nouvelle discussion (Ctrl+Maj+T)">+ Discussion</button>
      <button id="btn-new-claude" title="Nouvelle discussion Claude Code (Ctrl+Maj+N)">✳ Claude</button>
    </div>
    <div class="search-row">
      <input id="search" type="search" placeholder="Rechercher…" spellcheck="false">
      <button id="btn-home" class="icon" title="Terminal dans ton dossier personnel (Ctrl+Maj+Q)"><span class="prompt-glyph">›_</span></button>
      <button id="btn-sandbox" class="icon" title="Sandbox sbx : nouvelle ou existante, préparer le poste, configurer">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.8l5.6 3.1v6.2L8 14.2l-5.6-3.1V4.9z M2.4 4.9L8 8l5.6-3.1 M8 8v6.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-ssh" class="icon" title="SSH : nouvelle connexion, importer ~/.ssh/config, tunnels" hidden>
        <svg viewBox="0 0 16 16" width="16" height="16"><rect x="2" y="2.5" width="12" height="4.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="9" width="12" height="4.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="4.8" cy="4.75" r=".9" fill="currentColor"/><circle cx="4.8" cy="11.25" r=".9" fill="currentColor"/></svg>
      </button>
      <button id="btn-new-folder" class="icon" title="Nouveau dossier (Ctrl+Maj+D)">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M1.5 3.5h4l1.5 1.5h7.5v8h-13z M8 7.5v4 M6 9.5h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="tree"></div>
    <div class="sidebar-bottom">
      <button id="btn-settings" class="ghost">⚙ Réglages</button>
      <button id="btn-tunnels" class="ghost" hidden></button>
      <span class="signature" title="Fait par Y">Y</span>
    </div>
  </aside>
  <div id="resizer"></div>
  <main>
    <header class="topbar drag">
      <span id="active-dot" class="dot"></span>
      <span id="active-title"></span>
      <span id="active-path"></span>
    </header>
    <div id="terminals"><div id="split-divider"></div></div>
    <div id="findbar" hidden>
      <input id="find-input" placeholder="Rechercher dans le terminal" spellcheck="false">
      <span id="find-count"></span>
      <button id="find-case" class="icon" title="Respecter la casse">Aa</button>
      <button id="find-prev" class="icon" title="Précédent (Maj+Entrée)">↑</button>
      <button id="find-next" class="icon" title="Suivant (Entrée)">↓</button>
      <button id="find-close" class="icon" title="Fermer (Échap)">✕</button>
    </div>
    <div id="empty">
      <h1>Aucune discussion ouverte</h1>
      <p>Nouvelle discussion : <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>T</kbd> · Claude : <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>N</kbd> · Dossier : <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>D</kbd></p>
    </div>
  </main>

  <div id="menu" hidden></div>
  <div id="toast" hidden></div>
  <div id="palette" hidden>
    <input id="palette-input" placeholder="Aller à une discussion ou lancer une action…" spellcheck="false">
    <div id="palette-list"></div>
  </div>
  <div id="modal-backdrop" hidden><div id="modal"></div></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
  <script src="themes.js"></script>
  <script src="sbx.js"></script>
  <script src="ssh.js"></script>
  <script src="app.js"></script>
</body>
</html>
