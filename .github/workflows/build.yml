name: Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # La signature s'active dès que le secret SIGNPATH_API_TOKEN est ajouté au dépôt.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Younesh-windows
          path: |
            dist/*.exe
            dist/*.msi
      - name: Signer avec SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Remplacer par les fichiers signés
        if: env.SIGN == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          cp -f signed/*.exe signed/*.msi dist/ && node scripts/rehash-update.js
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # latest.yml (et la carte des blocs) servent à la mise à jour automatique de la version installée.
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.msi dist/*.blockmap dist/latest.yml --title "Younesh $GITHUB_REF_NAME" --notes "Télécharge **Younesh-Setup** (installation, se met à jour toute seule), **Younesh-x.y.z.msi** (installation par la DSI ou msiexec) ou **Younesh-Portable** (sans installation, se met à jour toute seule)."
