name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # La signature s'active dès que le secret SIGNPATH_API_TOKEN est ajouté au dépôt.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Younesh-windows
          path: |
            dist/*.exe
            dist/*.msi
      - name: Signer avec SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Remplacer par les fichiers signés
        if: env.SIGN == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          cp -f signed/*.exe signed/*.msi dist/ && node scripts/rehash-update.js
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # latest.yml (et la carte des blocs) servent à la mise à jour automatique de la version installée.
        # Les notes reprennent le message du commit tagué : son titre en gras, puis son corps (Markdown accepté),
        # sans les lignes Co-Authored-By, Claude-Session et Signed-off-by. Le texte d'installation suit toujours,
        # avec le lien « Code signing policy » que SignPath Foundation demande sur chaque page de téléchargement.
        run: |
          shopt -s nullglob
          subject=$(git log -1 --format=%s HEAD)
          body=$(git log -1 --format=%b HEAD | grep -viE '^(co-authored-by|claude-session|signed-off-by):' || true)
          {
            printf '**%s**\n\n' "$subject"
            [ -n "${body//[[:space:]]/}" ] && printf '%s\n\n' "$body"
            printf '## Installer\n\n'
            printf '%s\n\n' "Télécharge **Younesh-Setup** (installation, se met à jour toute seule), **Younesh-x.y.z.msi** (installation par la DSI ou msiexec) ou **Younesh-Portable** (sans installation, se met à jour toute seule)."
            printf '%s\n\n' "Déjà installé ? La mise à jour arrive toute seule."
            printf '%s\n' "Signature et confidentialité : [Code signing policy](https://github.com/jonasmelheb/younesh#code-signing-policy) · [Privacy policy](https://github.com/jonasmelheb/younesh#privacy-policy)"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.msi dist/*.blockmap dist/latest.yml --title "Younesh $GITHUB_REF_NAME" --notes-file notes.md

  # Signé et validé par Apple dès que les secrets sont ajoutés au dépôt. Chaque processeur a son paquet node-pty.
  mac:
    needs: build
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      SIGN: ${{ secrets.CSC_LINK != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.SIGN == 'true'
      - uses: actions/setup-node@v4
        if: env.SIGN == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.SIGN == 'true'
      - name: Construire, signer et faire valider par Apple
        if: env.SIGN == 'true'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Ajouter à la version
        if: env.SIGN == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg
